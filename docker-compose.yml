services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://calendar:calendar@db:5432/calendar
      SECRET_KEY: ${SECRET_KEY:-dev-change-me-in-production-needs-32-bytes}
      ALLOW_REGISTRATION: "true"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
