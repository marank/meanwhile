services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Passes live updates between the backend's worker processes.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://calendar:calendar@db:5432/calendar
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the environment}
      ALLOW_REGISTRATION: "true"
      # Served through a reverse proxy that terminates HTTPS (see README).
      BEHIND_PROXY: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_URL:-https://localhost}
      CORS_ORIGINS: ${PUBLIC_URL:-https://localhost}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      WEB_WORKERS: ${WEB_WORKERS:-4}
      # Links in emails; email notifications and invitations (see README).
      BASE_URL: ${PUBLIC_URL:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-calendar@localhost}
      IMIP_ADDRESS: ${IMIP_ADDRESS:-}
      IMIP_IMAP_HOST: ${IMIP_IMAP_HOST:-}
      IMIP_IMAP_USER: ${IMIP_IMAP_USER:-}
      IMIP_IMAP_PASSWORD: ${IMIP_IMAP_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: >
      sh -c "python manage.py migrate && exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000
      --workers $${WEB_WORKERS} --lifespan off --proxy-headers --forwarded-allow-ips '*'
      --ws-ping-interval 20 --ws-ping-timeout 20 --ws-max-size 65536"

volumes:
  postgres_data:
