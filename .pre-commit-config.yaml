# Fast checks before each commit; the full set is `just check` (= CI).
# Install once: uv tool run pre-commit install   (update the hooks by hand: uv tool run pre-commit autoupdate)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # The schema export writes no final newline; the drift check compares byte for byte.
        exclude: ^frontend/openapi\.json$
      - id: check-yaml
        # pnpm puts its own version into the lock file as a second YAML document.
        args: [--allow-multiple-documents]
      - id: check-json
        # tsconfig files are JSON with comments.
        exclude: ^(\.vscode/|frontend/tsconfig.*\.json$)
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-format
        name: prettier (frontend)
        language: system
        entry: bash -c 'cd frontend && pnpm exec prettier --write --ignore-unknown "${@#frontend/}"' --
        files: ^frontend/
        # Generated: written by pnpm and the backend's schema export, checked against them in CI.
        exclude: ^frontend/(pnpm-lock\.yaml|openapi\.json)$
      - id: frontend-oxlint
        name: oxlint (frontend)
        language: system
        entry: bash -c 'cd frontend && pnpm exec oxlint "${@#frontend/}"' --
        files: ^frontend/src/.*\.(ts|vue)$
