# Shared proxy settings for every location that goes to uvicorn. The client's address, scheme and
# host are set here from what nginx determined (TRUSTED_PROXIES, see app.conf.template), never
# taken over from the request, so the backend may trust them.
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $client_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $client_proto;
proxy_redirect off;
