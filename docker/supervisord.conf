; supervisord runs as PID 1 and keeps nginx, uvicorn and the task queue's worker running, all as
; the container's user "app"; runtime files live in /tmp. Every program logs to the container's
; output. If one keeps failing, exit-on-fatal stops supervisord and with it the container, so
; Docker's restart policy takes over.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; For `supervisorctl status` inside the container. supervisord logs a CRIT notice that it has no
; password; only "app" may open the socket (chmod 0700), which is enough here.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=/bin/sh /usr/local/bin/start-nginx
priority=10
startsecs=2
startretries=3
autorestart=true
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The ASGI app: API, CalDAV, iCal feeds and the live update WebSocket. Only nginx reaches it, so
; its X-Forwarded-* headers are trusted (nginx sets them itself, see django_proxy.conf).
[program:uvicorn]
command=sh -c 'exec uvicorn config.asgi:application --host 127.0.0.1 --port 8000 --workers "${WEB_WORKERS:-4}" --lifespan off --proxy-headers --forwarded-allow-ips 127.0.0.1 --ws-ping-interval 20 --ws-ping-timeout 20 --ws-max-size 65536'
directory=/app
priority=20
startsecs=5
startretries=3
autorestart=true
stopasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The task queue: emails, reminders, answers from the iMIP mailbox and clean-ups (core/tasks.py).
[program:worker]
command=python manage.py procrastinate worker
directory=/app
priority=30
startsecs=5
startretries=3
autorestart=true
stopasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:exit-on-fatal]
command=python3 /usr/local/bin/exit-on-fatal
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
