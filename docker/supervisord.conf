; Included by /etc/supervisor/supervisord.conf. Every program logs to the container's output.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
priority=10
autorestart=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The ASGI app: API, CalDAV, iCal feeds and the live update WebSocket. Only nginx reaches it, so
; its X-Forwarded-* headers are trusted.
[program:uvicorn]
command=sh -c 'exec uvicorn config.asgi:application --host 127.0.0.1 --port 8000 --workers "${WEB_WORKERS:-4}" --lifespan off --proxy-headers --forwarded-allow-ips "*" --ws-ping-interval 20 --ws-ping-timeout 20 --ws-max-size 65536'
directory=/app
user=app
priority=20
autorestart=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The task queue: emails, reminders, answers from the iMIP mailbox and clean-ups (core/tasks.py).
[program:worker]
command=python manage.py procrastinate worker
directory=/app
user=app
priority=30
autorestart=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
