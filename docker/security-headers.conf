# Headers of the frontend's responses (docker/nginx.conf); the backend sets its own (Django's
# SecurityMiddleware). Included in each location, since one with an add_header of its own takes
# none from the levels above. No HSTS: the proxy in front decides that for its domains.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# Links in emails carry tokens in their path (RSVP); other sites don't get to see them.
add_header Referrer-Policy "same-origin" always;
