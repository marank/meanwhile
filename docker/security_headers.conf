# Security headers for everything nginx serves itself (frontend, assets, static files). Included
# in each location, because add_header in a location drops inherited ones. Django sets its own
# headers (CSP included) for what it serves. No HSTS: the proxy in front decides that for its
# domains.
#
# CSP: scripts only from our origin; images also as data: URLs (logo and favicon are stored that
# way). style-src needs 'unsafe-inline' for the style attributes the components set.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Links in emails carry tokens in their path (RSVP); other sites don't get to see them.
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
