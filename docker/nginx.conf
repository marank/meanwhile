# Serves the built frontend and passes the backend's paths on to uvicorn (127.0.0.1:8000).
# HTTPS is terminated in front of the container; its scheme and host are passed on.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream backend {
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    # The client's address: the reverse proxy in front (TRUSTED_PROXIES, written to this file by
    # docker/trusted-proxies.sh) adds it to X-Forwarded-For; whatever a client puts in there itself
    # is ignored. The backend takes the address from here alone, its failed-login limits count by it.
    include /etc/nginx/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $remote_addr;

    # The app; every other path is a route of the app.
    root /srv/frontend;

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # File names carry their content's hash.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Django admin's static files.
    location /static/ {
        alias /app/staticfiles/;
    }

    location ~ ^/(api|admin|ics|caldav|\.well-known/caldav)(/|$) {
        proxy_pass http://backend;
    }

    # Live updates; longer than the app's heartbeat (25 s), so idle connections stay open.
    location /ws/ {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
