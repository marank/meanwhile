# The whole development stack: `docker compose -f docker-compose.dev.yml up --build`
# App at http://localhost:5173 (Vite), API at http://localhost:8000, emails at http://localhost:8025.
# The source is mounted into the containers: the backend, the worker and Vite reload on changes.
# Only the services next to the app (`... up -d postgres redis mailpit`) for running it outside Docker.
name: calendar-dev

x-backend: &backend
  image: calendar-dev-backend
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
  volumes:
    - ./backend:/app
  # The project's .env (ADMIN_*, SECRET_KEY, ...); the wiring below takes precedence over it.
  env_file:
    - path: .env
      required: false
  environment: &backend-environment
    ENVIRONMENT: development
    DATABASE_URL: postgresql://calendar:calendar@postgres:5432/calendar
    REDIS_URL: redis://redis:6379/0
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
    EMAIL_USE_TLS: "false"
    EMAIL_USE_SSL: "false"
    DEFAULT_FROM_EMAIL: calendar@localhost
    IMIP_ADDRESS: calendar@localhost

services:
  # The development database (the backend's default DATABASE_URL); the task queue needs PostgreSQL.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Passes live updates between the backend and the task queue's worker.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  # Catches every email the backend sends (SMTP on 1025) and shows it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"

  # Applies the migrations (the task queue's included) and sets up the admin user of ADMIN_EMAIL
  # (.env) before the backend and the worker start.
  migrate:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate && python manage.py ensure_admin"]
    depends_on:
      postgres:
        condition: service_healthy

  # runserver (daphne: API, CalDAV and WebSockets) restarts itself on changes to the code.
  backend:
    <<: *backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  # The task queue's worker (core/tasks.py); watchfiles restarts it on changes to Python files.
  worker:
    <<: *backend
    command: ["watchfiles", "--filter", "python", "python manage.py procrastinate worker", "/app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  # Vite with hot module replacement; passes /api, /caldav, /ics and /ws on to the backend.
  frontend:
    image: calendar-dev-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "pnpm install --frozen-lockfile && exec pnpm dev --host 0.0.0.0"]
    environment:
      BACKEND_URL: http://backend:8000
      # pnpm doesn't ask before reinstalling node_modules.
      CI: "true"
    volumes:
      - ./frontend:/app
      # The container's own node_modules, separate from the host's.
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  node_modules:
