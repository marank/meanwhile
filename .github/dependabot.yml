# Weekly dependency updates, minor and patch versions in one pull request per area;
# majors one by one. Every ecosystem waits 7 days after a release (cooldown) before
# proposing it: a hijacked release is usually found and pulled within days. Security
# updates are not delayed. Pinned digests (Dockerfile) and commit SHAs (workflows) are updated
# together with their tag. Not covered (bump by hand, see AGENTS.md): the images started
# with `docker run` in build.yaml (TRIVY_IMAGE, POSTGRES_IMAGE), the ARGs in the Dockerfile (PG_MAJOR, SUPERVISOR_VERSION), the tool versions in the
# justfile (actionlint, zizmor) and the workflows (just), pnpm's packageManager field if
# Dependabot leaves it alone, and the pre-commit hooks (deliberately by hand: `uv tool run pre-commit autoupdate`).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # Follows the Node major of the images (node:24 in the Dockerfile and CI).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # The production Dockerfile and the development images of compose.dev.yml.
  - package-ecosystem: docker
    directories: ["/", "/backend", "/frontend"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node: only even majors (LTS lines). Python minors need a look at requires-python
      # and wheel support; they still come, as single PRs.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A PostgreSQL major upgrade needs a dump and restore of the data.
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
