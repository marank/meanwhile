# Production: PostgreSQL, Redis, the app and the worker. Works with a .env next to it and nothing
# else from the repository: copy this file and .env.example (as .env) to the server, fill in .env,
# `docker compose up -d`. The app serves the frontend and the backend on APP_BIND over HTTP; HTTPS
# is terminated in front of it (see README, "Deployment with Docker").
name: meanwhile

# Unprivileged, without any capabilities, and nothing writable but /tmp (and the volumes).
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# The app and the worker: same image, same configuration.
x-app: &app
  <<: *hardened
  # The image CI pushes; APP_IMAGE pins a version (ghcr.io/marank/meanwhile:1.2) or points at a
  # local build (`docker build -t meanwhile .`, APP_IMAGE=meanwhile).
  image: ${APP_IMAGE:-ghcr.io/marank/meanwhile:latest}
  restart: unless-stopped
  env_file: .env
  # Fixed by this setup; the rest comes from .env.
  environment:
    DEBUG: "false"
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-meanwhile}
      POSTGRES_USER: ${DB_USER:-meanwhile}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      # From 18 on, the data lives in a subdirectory per major version (18/docker), so a later
      # pg_upgrade finds old and new side by side in this one volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Passes live updates between the uvicorn processes and the worker; holds no data. Redis 8 is
  # used unmodified under its AGPLv3 option (it also offers RSALv2 and SSPLv1), a separate program
  # the app talks to over the network: nothing of its license reaches the app's code.
  redis:
    <<: *hardened
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    user: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # nginx (frontend, proxy) and uvicorn (API, CalDAV, WebSockets) under supervisord.
  app:
    <<: *app
    ports:
      - "${APP_BIND:-127.0.0.1:6326}:8080"
    volumes:
      - app_data:/data

  # The task queue (apps/core/tasks.py): emails, reminders, iMIP answers, clean-ups and the nightly
  # backup. Own container, so it has its own logs, restarts and health check; waits until the app
  # has migrated.
  worker:
    <<: *app
    command: ["sh", "/usr/local/bin/worker"]
    # A minimal init as PID 1 forwards `docker stop` and reaps finished child processes (pg_dump).
    init: true
    volumes:
      - app_data:/data
      # Nightly pg_dump at BACKUP_TIME (in TIME_ZONE), kept BACKUP_KEEP_DAYS days. Manual dump:
      #   docker compose exec worker python manage.py backup_database
      # Copy dumps off the host:  docker compose cp worker:/backups ./backups
      # Restore (README, "Backups"): pg_restore --clean --if-exists into the db container.
      - backups:/backups
    healthcheck:
      # The image's HTTP health check is for the app; this checks the worker's database link.
      test: ["CMD", "python", "manage.py", "procrastinate", "healthchecks"]
      interval: 60s
      timeout: 10s
      start_period: 60s

volumes:
  pgdata:
  app_data:
  backups:
