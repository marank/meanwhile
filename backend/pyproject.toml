[project]
name = "meanwhile-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "a2wsgi>=1.10,<2",
    "argon2-cffi>=23.1,<24.0",
    "channels>=4.2,<5",
    "channels-redis>=4.2,<5",
    "daphne>=4.1,<5",
    "dj-database-url>=2.3,<3.0",
    "django>=5.1,<5.2",
    "django-allauth>=65.0,<66.0",
    "django-cors-headers>=4.6,<5.0",
    "django-ninja>=1.3,<2.0",
    "email-validator>=2.2,<3.0",
    "icalendar>=5.0,<7.0",
    "procrastinate[django]>=3,<4",
    "psycopg[binary]>=3.2,<4.0",
    "python-dateutil>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "radicale>=3.4,<4.0",
    "uuid-utils>=0.10,<1.0",
    "uvicorn[standard]>=0.32,<1",
    "vobject>=0.9.7,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1",
    "pytest-django>=4.9,<5.0",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
# In parallel, one process per CPU, each with its own test database; `-n 0` for one (e.g. to debug).
addopts = "-n auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["core/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "UP",  # pyupgrade
    "B",   # bugbear
    "DJ",  # Django
]
ignore = [
    "DJ008",  # __str__ on every model
]

[tool.ruff.lint.isort]
known-first-party = ["config", "core"]

[tool.ruff.lint.flake8-bugbear]
# Django Ninja declares parameters with these in defaults.
extend-immutable-calls = ["ninja.Query", "ninja.Path", "ninja.Body", "ninja.Form", "ninja.File"]

[tool.ruff.lint.per-file-ignores]
# The texts of the emails, one per line.
"core/services/mail_texts.py" = ["E501"]
# Until the tests are run through `ruff format`, which wraps their long lines.
"core/tests/*" = ["E501"]
