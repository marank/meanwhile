[project]
name = "calendar-backend"
version = "0.1.0"
description = "Calendar app backend"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<1.15",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "PyJWT>=2.9,<3.0",
    "pwdlib[argon2]>=0.2,<0.4",
    "python-multipart>=0.0.17,<1.0",
    "email-validator>=2.2,<3.0",
    "python-dateutil>=2.9,<3.0",
    "icalendar>=5.0,<7.0",
    "vobject>=0.9.7,<1.0",
    "Radicale>=3.4,<4.0",
    "uuid-utils>=0.10,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "a2wsgi>=1.10,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "pytest-asyncio>=0.24,<1.0",
]
