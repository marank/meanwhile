[project]
name = "calendar-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<24.0",
    "dj-database-url>=2.3,<3.0",
    "django>=5.1,<5.2",
    "django-allauth>=65.0,<66.0",
    "django-cors-headers>=4.6,<5.0",
    "django-ninja>=1.3,<2.0",
    "email-validator>=2.2,<3.0",
    "gunicorn>=23.0,<24.0",
    "icalendar>=5.0,<7.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dateutil>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "radicale>=3.4,<4.0",
    "uuid-utils>=0.10,<1.0",
    "vobject>=0.9.7,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
