# The services next to the natively run app (`just services`), to develop against PostgreSQL like
# CI, with live updates across processes (Redis) and the emails caught by Mailpit. Then in .env:
# DB_HOST=localhost, REDIS_URL=redis://localhost:6379/0 and the Mailpit settings (.env.example).
name: meanwhile-dev

services:
  # PostgreSQL like production and CI (natively the default is SQLite: no queue, no worker).
  postgres:
    image: postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    environment:
      POSTGRES_USER: meanwhile
      POSTGRES_PASSWORD: meanwhile
      POSTGRES_DB: meanwhile
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meanwhile -d meanwhile"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Passes live updates between the backend's processes and the task queue's worker.
  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

  # Catches every email the backend sends (SMTP on 1025) and shows it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.34@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
